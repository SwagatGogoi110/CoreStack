services:
  CloudStack:
    build:
      context: .
      dockerfile: docker/Dockerfile
    tty: true
    ports:
      - "4566:4566"
      - "6379-6399:6379-6399"
      - "7001-7099:7001-7099"
      - "9200-9299:9200-9299"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      CLOUDSTACK_SERVICES_DOCKER_NETWORK: CloudStack_default
      CLOUDSTACK_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      # CLOUDSTACK_STORAGE_HOST_PERSISTENT_PATH is no longer needed.
      # CloudStack now uses named Docker volumes by default.
      # If you were using this env var for persistence, migrate: docker volume ls -f label=CloudStack=true
      CLOUDSTACK_HOSTNAME: CloudStack
      CLOUDSTACK_BASE_URL: http://CloudStack:4566
      CLOUDSTACK_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "true"
    networks:
      CloudStack_default:
        aliases:
          - localhost.cloudstack.io

networks:
  CloudStack_default:
    name: CloudStack_default
